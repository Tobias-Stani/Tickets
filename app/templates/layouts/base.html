<!doctype html>
<html lang="es" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {# 4xx responses carry user-facing alerts: let HTMX swap them into the form target. #}
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"4..","swap":true,"error":false},{"code":"...","swap":false,"error":true}]}'>
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  {# Inline so the theme applies before first paint (no light flash). Defaults to the OS setting. #}
  <script>
    function storedTheme() { try { return localStorage.getItem("theme"); } catch { return null; } }
    function toggleTheme() {
      const dark = document.documentElement.classList.toggle("dark");
      try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch {}
    }
    document.documentElement.classList.toggle("dark",
      storedTheme() ? storedTheme() === "dark" : matchMedia("(prefers-color-scheme: dark)").matches);
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
</head>
<body class="h-full bg-slate-50 text-slate-800 antialiased"
      hx-headers='{"{{ csrf_header }}": "{{ csrf_token(request) }}"}'>
  {% block body %}{% endblock %}
</body>
</html>
